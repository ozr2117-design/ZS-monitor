name: Keep Alive

on:
  schedule:
    # UTC 22:00 = BJ 06:00 (Next Day)
    # UTC 09:00 = BJ 17:00
    - cron: '0 9,22 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Wake up Streamlit App
        run: python keep_alive.py
