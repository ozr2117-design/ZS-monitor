name: Funds Monitor

on:
  schedule:
    # 北京时间 9:30-15:30 对应 UTC 1:30-7:30。
    # 每30分钟运行一次，检查是否有信号。
    - cron: '30 1-7 * * 1-5'
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Monitor Script
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python headless_monitor.py
